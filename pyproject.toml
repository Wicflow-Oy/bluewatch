[project]
name = "bluewatch"
version = "0.1.0"
description = "Finds new ocean companies, shows what is known and missing, and links each one to its next buyer, partner, grant or investor."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bluewatch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
